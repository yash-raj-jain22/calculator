<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator">
        <div class="screen">
            <input type="text" placeholder="0">
        </div>
        <div class="buttons">
            <div class="row1">
                <button class="op_btn btn ac_btn">AC</button>
                <button class="op_btn btn del_btn">DEL</button>
                <button class="op_btn btn">%</button>
                <button class="op_btn btn">/</button>
            </div>
            <div class="row2">
                <button class="num_btn btn">7</button>
                <button class="num_btn btn">8</button>
                <button class="num_btn btn">9</button>
                <button class="op_btn btn">*</button>
            </div>
            <div class="row3">
                <button class="num_btn btn">4</button>
                <button class="num_btn btn">5</button>
                <button class="num_btn btn">6</button>
                <button class="op_btn btn">-</button>
            </div>
            <div class="row4">
                <button class="num_btn btn">1</button>
                <button class="num_btn btn">2</button>
                <button class="num_btn btn">3</button>
                <button class="op_btn btn">+</button>
            </div>
            <div class="row5">
                <button class="num_btn btn">00</button>
                <button class="num_btn btn">0</button>
                <button class="num_btn btn">.</button>
                <button class="equal_btn  btn">=</button>
            </div>
        </div>
    </div>
</body>


<script src="script.js"></script>

</html>
